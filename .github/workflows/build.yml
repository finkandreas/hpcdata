name: build

env:
  IMAGE_TAG: "1.0"

on:
  merge_group:
  pull_request:
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      DO_PUSH: ${{ github.repository == 'finkandreas/hpcdata' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: env.DO_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.DO_PUSH == 'true' }}
          tags: ghcr.io/${{ github.repository_owner }}/hpcdata:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max