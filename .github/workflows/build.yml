name: build

on:
  merge_group:
  pull_request:
  push:
    branches:
    - main
    tags:
    - 'v*'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      # Push on commits to main and on release tags (v1.0.1, ...), only from the upstream repo
      DO_PUSH: ${{ github.repository == 'finkandreas/hpcdata' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: env.DO_PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/hpcdata
          tags: |
            # the newest version on main
            type=edge,branch=main
            # commit sha
            type=sha,format=short
            # Release tag vx.y.z -> x.y.z, x.y, x (as well as latest)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build (and push on main / release tags)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.DO_PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest image
        if: env.DO_PUSH == 'true'
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/hpcdata
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true