name: build

env:
  IMAGE_TAG: "1.0"

on:
  merge_group:
  pull_request:
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/hpcdata:${{ env.IMAGE_TAG }}
          cache-to: type=gha,mode=max
      - name: Login to GHCR
        if: github.repository == 'finkandreas/hpcdata' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker image
        if: github.repository == 'finkandreas/hpcdata' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hpcdata:${{ env.IMAGE_TAG }}
          cache-from: type=gha
